<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый сайт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🚀 Привет, команда!</h1>
        <p>Этот сайт запущен на компьютере <strong id="hostName">загрузка...</strong></p>
        <p>Вы видите его через <strong>Radmin VPN</strong> 🎉</p>
        
        <div class="card">
            <h2>Интерактивная кнопка!!</h2>
            <button id="clickBtn">Нажми меня!</button>
            <p id="clickCount">Нажатий: 0</p>
        </div>

        <div class="card">
            <h2>Текущее время</h2>
            <p id="currentTime">загрузка...</p>
        </div>

        <div class="footer">
            <p>Сделано с ❤️ для совместной разработки</p>
            <p>IP вашего компьютера в Radmin VPN: <span id="ipDisplay">неизвестен</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
